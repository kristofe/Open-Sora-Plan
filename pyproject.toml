[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opensora"
version = "1.2.0"
description = "Reproduce OpenAI's Sora."
readme = "README.md"
# Note: Python 3.13 is not supported due to package compatibility issues
# Recommended: Python 3.11 or 3.12
requires-python = ">=3.8,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    # Core ML frameworks - PyTorch 2.9.0+cu130 recommended for NVIDIA hardware
    "torch>=2.1.0", "torchvision>=0.16.0",
    "transformers==4.40.1", "accelerate==0.29.3", "tokenizers==0.19.1", 
    "diffusers>=0.35.0",  # Updated for PyTorch 2.9.0 compatibility
    "huggingface-hub>=0.34.0,<1.0",  # Required by transformers and diffusers 
    
    # Computer vision and image processing
    "albumentations==1.4.0", 
    "opencv-python==4.9.0.80", 
    "opencv-python-headless==4.9.0.80",
    "pillow>=10.2.0",
    
    # Video processing - av (PyAV) provides video decoding
    # Note: decord is provided by custom adapter (decord.py) using PyAV backend
    "av>=11.0.0",
    
    # Tensor operations and math
    "einops==0.7.0",  # Required for tensor rearrangement operations
    "numpy>=1.24.4",
    "scipy>=1.10.1",
    
    # Data processing
    "pandas==2.0.3",
    "h5py==3.10.0",
    
    # Deep learning utilities  
    "pytorch-lightning>=2.2.1",
    "pytorchvideo>=0.1.5",
    "timm==0.9.16",
    "torchdiffeq>=0.2.3",
    "torchmetrics>=1.3.2",
    
    # Training acceleration - xformers built from source (0.0.32.post2)
    "xformers>=0.0.22.post7",
    
    # Media processing
    "imageio==2.34.0",
    "imageio-ffmpeg>=0.4.9",
    "moviepy>=1.0.3",
    "pydub==0.25.1",
    "scikit-video>=1.1.11",
    
    # ML evaluation and logging
    "scikit-learn>=1.3.2",
    "matplotlib==3.7.5",
    "tensorboard==2.14.0",
    "wandb>=0.16.3",
    "test-tube==0.7.5",
    
    # NLP and text processing
    "sentencepiece==0.1.99",
    "beautifulsoup4==4.12.3",
    "ftfy==6.1.3",
    "regex==2023.12.25",
    
    # Web and API
    "fastapi==0.110.0",
    "uvicorn==0.27.1",
    "gradio==4.0.0",
    "pydantic==2.6.4",
    
    # Configuration and utilities
    "omegaconf==2.1.1",
    "PyYAML==6.0.1",
    "tqdm==4.66.2",
    "six==1.16.0",
    
    # Network and downloads
    "requests==2.31.0",
    "urllib3==2.2.1",
    "idna==3.6",
    "gdown==5.1.0",
]

[project.optional-dependencies]
# Note: deepspeed 0.12.6 is incompatible with PyTorch 2.9.0 (elastic agent API changes)
# For inference only, deepspeed is not required. For training with PyTorch 2.9.0,
# use a newer deepspeed version or downgrade PyTorch to 2.1-2.5
train = ["deepspeed==0.12.6"]
dev = ["mypy==1.8.0"]


[project.urls]
"Homepage" = "https://github.com/PKU-YuanGroup/Open-Sora-Plan"
"Bug Tracker" = "https://github.com/PKU-YuanGroup/Open-Sora-Plan/issues"

[tool.setuptools.packages.find]
exclude = ["assets*", "docker*", "docs", "scripts*"]

[tool.wheel]
exclude = ["assets*", "docker*", "docs", "scripts*"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_calls = true
check_untyped_defs = true
no_implicit_optional = true

# Installation Notes
# ==================
# 
# System Requirements:
# - Python 3.11 or 3.12 (Python 3.13 is NOT supported)
# - CUDA 13.0 for GPU support (PyTorch 2.9.0+cu130)
# - System packages: cmake, pkg-config, libhdf5-dev, ffmpeg
#
# Installation Steps:
# 1. Create conda environment with Python 3.12:
#    conda create -n opensora python=3.12
#    conda activate opensora
#
# 2. Install system dependencies (Ubuntu/Debian):
#    apt-get update
#    apt-get install -y cmake pkg-config libhdf5-dev ffmpeg libavcodec-dev \
#                       libavformat-dev libavutil-dev libavfilter-dev libavdevice-dev
#
# 3. Install PyTorch with CUDA 13.0:
#    pip install torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cu130
#
# 4. Install xformers (builds from source):
#    pip install xformers --no-build-isolation
#
# 5. Install decord adapter:
#    Copy decord.py to site-packages:
#    cp decord.py $CONDA_PREFIX/lib/python3.12/site-packages/decord.py
#    Note: This provides a PyAV-based decord API wrapper since native decord
#          is incompatible with FFmpeg 6.x
#
# 6. Install Open-Sora:
#    pip install -e .
#
# Known Issues:
# - decord 0.6.0 is not available on PyPI and won't build with FFmpeg 6.x
#   Solution: Use the included decord.py adapter (PyAV-based)
# - xformers 0.0.22.post7 requires building from source on ARM64
#   Newer versions (0.0.32+) work and build successfully
# - Python 3.13 has breaking API changes incompatible with:
#   * tokenizers (PyO3 limitation)
#   * pydantic-core (ForwardRef API changes)
# - deepspeed 0.12.6 is incompatible with PyTorch 2.9.0 (elastic agent API changes)
#   Solution: Code has been updated to make deepspeed import optional for inference
# - diffusers 0.28.0 had deprecated imports that broke with newer dependencies
#   Solution: Upgraded to diffusers>=0.35.0 with compatibility layer for imports
# - pytorchvideo 0.1.5 imports functional_tensor which was removed in torchvision 0.24.0
#   Solution: Added fallback import in pytorchvideo's augmentations.py
